name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure
        run: |
          $pythonExe = (Get-Command python).Source
          cmake -S . -B build -A x64 "-DPython3_EXECUTABLE=$pythonExe"

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BaritoneBedrock
          path: |
            build/bin/RelWithDebInfo/BaritoneBedrock.dll
            build/bin/RelWithDebInfo/BaritoneBedrock.pdb
            build/bin/RelWithDebInfo/BaritoneControlPanel.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BaritoneBedrock

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BaritoneBedrock.dll
            BaritoneBedrock.pdb
            BaritoneControlPanel.exe
          body_path: notes.md
